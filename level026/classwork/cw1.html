<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Example</title>
  <style>
/* width → ელემენტის შიგთავსის სიგანე 
 height → ელემენტის შიგთავსის სიმაღლე 
 padding → შიდა დაშორება შიგთავსსა და ჩარჩოს შორის 
 border → ჩარჩო, რომელიც გარს აკრავს ელემენტს 
margin → გარე დაშორება სხვა ელემენტებთან 
 background-color → ფონის ფერი უკეთესი ხილვადობისთვის */

.box {
    width: 200px;
    height: 100px;
    padding: 20px;
    border: 5px solid blue;
    margin: 30px;
    background-color: aqua;
}
  </style>
</head>
<body>
    <p class="box">This is a CSS Box Model example</p>

  <!-- 
  სტანდარტული box model-ი:

  ელემენტის სრული სიგანე:
  width + padding-left + padding-right + border-left + border-right + margin-left + margin-right

  ელემენტის სრული სიმაღლე:
  height + padding-top + padding-bottom + border-top + border-bottom + margin-top + margin-bottom

  მაგალითად:
  width = 200px
  height = 100px
  padding = 20px
  border = 5px
  margin = 30px

  სრული სიგანე:200 + 20 + 20 + 5 + 5 + 30 + 30 = 310px
  სრული სიმაღლე:100 + 20 + 20 + 5 + 5 + 30 + 30 = 210px
  -->
</body>
</html>
