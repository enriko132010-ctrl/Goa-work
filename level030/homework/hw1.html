<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position and Z-Index Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1) Position Examples -->
    <div class="static-example">Static Example</div>
    <div class="relative-example">Relative Example</div>
    <div class="absolute-parent">
        Absolute Example
        <div class="absolute-example">Absolute Child</div>
    </div>
    <div class="fixed-example">Fixed Example (scroll)</div>
    <div class="sticky-example">Sticky Example (scroll)</div>

    <!-- 2) Z-Index Example -->
    <div class="z-index-example1"></div>
    <div class="z-index-example2"></div>

    <!-- 4) Centering a div -->
    <div class="parent-center">
        <div class="child-center">Centered Div</div>
    </div>

    <!-- 5) Fixed Navigation + Scrollable Divs -->
    <div class="navigation">Navigation Bar</div>
    <div class="content">
        <div>Div 1</div>
        <div>Div 2</div>
        <div>Div 3</div>
        <div>Div 4</div>
        <div>Div 5</div>
        <div>Div 6</div>
        <div>Div 7</div>
        <div>Div 8</div>
        <div>Div 9</div>
        <div>Div 10</div>
    </div>

</body>
</html>
