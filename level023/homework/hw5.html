<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- TABLE გამოიყენება მონაცემების ცხრილის სახით 
     წარმოსაჩენად. ეს კარგი პრაქტიკაა მაშინ, როცა 
     გვაქვს სტრუქტურირებული მონაცემები (მაგალითად: 
     სახელები, ასაკი, ფასები და ა.შ.) რადგან 
     ინფორმაცია ჩანს მოწესრიგებულად – რიგებად და 
     სვეტებად. -->

     <table>

    <!-- <tr> ნიშნავს Table Row (ცხრილის რიგი). ყოველი <tr> ქმნის ახალ ჰორიზონტალურ რიგს ცხრილში. -->
    <tr>

        <!-- <th> ნიშნავს Table Header. გამოიყენება სათაურებისთვის. -->
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
    </tr>

    <tr>
        <!-- <td> ნიშნავს Table Data. გამოიყენება ჩვეულებრივი მონაცემების ჩასაწერად. -->
        <td>Priya</td>
        <td>Sharma</td>
        <td>24</td>
    </tr>

    <tr>
        <td>Arun</td>
        <td>Singh</td>
        <td>32</td>
    </tr>
</body>
</html>
